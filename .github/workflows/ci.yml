name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ffmpeg is NOT preinstalled on either runner image — measured against
      # both manifests. It must be installed.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      # The previous step was named "Assert ffmpeg major version" and asserted
      # `test "$v" = "8"` after a bare `apt-get install -y ffmpeg`. It claimed a
      # pin it did not perform, and the assertion could never hold: ubuntu-latest
      # is Ubuntu 24.04, which ships ffmpeg 6.1.1, and no Ubuntu release ships
      # 8.x. The Linux leg therefore failed deterministically on every run, for a
      # reason no code change could fix — Ruling B's own stated failure mode,
      # "CI red on a test that can never pass there trains everyone to ignore CI".
      #
      # tools.FFMPEG_FLOOR is now "6", a real floor rather than a series pin —
      # measured against cutline's own source (nothing newer than ~ffmpeg 3) and
      # its test fixtures (-display_rotation, ffmpeg 6.0). This step therefore
      # calls cutline's own find_tool(floor=FFMPEG_FLOOR) instead of
      # reimplementing the floor comparison in a heredoc: CI now exercises the
      # exact code path `cutline doctor` runs, not a parallel copy of it that
      # could quietly drift from the library.
      - name: Assert ffmpeg meets cutline's floor (the same check `cutline doctor` runs)
        shell: bash
        run: |
          uv run python - <<'PY'
          import sys

          from cutline.tools import FFMPEG_FLOOR, ToolError, find_tool

          for name in ("ffmpeg", "ffprobe"):
              try:
                  tool = find_tool(name, floor=FFMPEG_FLOOR)
              except ToolError as exc:
                  print(f"::error::{exc}")
                  sys.exit(1)
              print(f"{name}: {tool.version}  ({tool.path})")
          PY

      - name: Lint
        run: uv run ruff check .

      - name: Roadmap sync guard
        run: uv run python scripts/check_roadmap_sync.py

      # auto-editor and hyperframes are not installed on CI. Both dependencies
      # are expressed as markers (requires_auto_editor, requires_hyperframes),
      # not file-path deselection, because a marker survives a test file being
      # renamed or split and a --deselect path does not — see Task 9 report
      # for the marker-sweep evidence (which tests carry which marker and why).
      #
      # There used to be a third marker here, requires_pinned_ffmpeg, deselecting
      # a test that asserted the operator's old 8.x SERIES pin was satisfiable —
      # a pin the Linux runner's 6.1.1 could never meet. Now that FFMPEG_FLOOR is
      # a real floor of 6, that test (and every other ffmpeg/ffprobe test) is
      # satisfiable on every runner cutline supports, so nothing needs deselecting
      # for it anymore.
      - name: Tests
        run: |
          uv run pytest -v \
            -m "not requires_auto_editor and not requires_hyperframes"
