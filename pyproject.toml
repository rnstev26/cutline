[project]
name = "cutline"
version = "0.1.0"
description = "An EDL-based video pipeline for talking-head footage."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Raven Stevenson" }]
keywords = ["video", "ffmpeg", "edl", "silence-removal", "media-pipeline"]
dependencies = [
    "typer>=0.12",
]

[project.scripts]
cutline = "cutline.cli:app"

[project.urls]
Repository = "https://github.com/rnstev26/cutline"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_ffmpeg: test shells out to a real ffmpeg/ffprobe binary",
    "requires_auto_editor: test needs the auto-editor binary, which CI does not install",
    "requires_hyperframes: test needs the hyperframes CLI, which CI does not install",
    "requires_pinned_ffmpeg: test asserts FFMPEG_MIN itself; CI runners ship 6.1.1, not 8.x",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
